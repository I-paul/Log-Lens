<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LogLens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>LogLens</h2>
      <span class="badge" id="statusBadge">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Disconnected</span>
      </span>
    </div>

    <div class="actions">
      <button id="toggleBtn" class="btn">Start Capture</button>
    </div>

    <div id="lastResult" class="result-section" style="display:none;">
      <div class="section-label">Latest Analysis</div>
      <div id="resultSummary" class="result-summary"></div>
      <div id="resultFile" class="result-file"></div>
    </div>

    <div class="footer">
      <span class="version">v0.1.0</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
